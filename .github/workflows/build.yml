name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Xray core for Android, built by the AndroidLibXrayLite project (same core v2rayNG uses).
  XRAY_LIB_VERSION: v26.10.21
  XRAY_LIB_SHA256: e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4
  # Password of signing/release.jks (repository secret).
  SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          echo "${XRAY_LIB_SHA256}  app/libs/libv2ray.aar" | sha256sum -c -

      - name: Check signing secret
        if: env.SIGNING_PASSWORD == ''
        run: echo "::warning::SIGNING_PASSWORD secret is not set. The APK is debug-signed and will not be published."

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunnelLock-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_PASSWORD != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/release/*.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "TunnelLock build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build from ${GITHUB_SHA::7}. Install the APK on your phone."
