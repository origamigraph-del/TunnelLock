name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Xray core for Android, built by the AndroidLibXrayLite project (same core v2rayNG uses).
  XRAY_LIB_VERSION: v26.10.21
  XRAY_LIB_SHA256: e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4
  # Password of signing/release.jks (repository secret).
  SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
  # SHA-256 of the certificate in signing/release.jks. Releases must carry exactly this
  # signature, otherwise they cannot update the installed app.
  RELEASE_CERT_SHA256: 5e5cb12b9e9aca85bc7c05843f794dac744ccb0c2b39b9f2eba8dfce6b739eed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          echo "${XRAY_LIB_SHA256}  app/libs/libv2ray.aar" | sha256sum -c -

      - name: Check signing secret
        if: env.SIGNING_PASSWORD == ''
        run: echo "::warning::SIGNING_PASSWORD secret is not set. The APK is debug-signed and will not be published."

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:assembleRelease :probe:assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Show compiler errors and Gradle's failure reason as one annotation on the run page.
          details=$( { grep -E '^e: ' build.log | head -20; grep -A 15 'What went wrong' build.log | head -30; } \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${details:-see the Test and build step log}"

      - name: Check APK signatures
        id: signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          release=true
          for apk in app/build/outputs/apk/release/*.apk probe/build/outputs/apk/release/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            digest=$(echo "$certs" | grep -m1 -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print tolower($NF)}')
            echo "::notice title=$(basename "$apk")::${digest:-$(echo "$certs" | head -5 | sed ':a;N;$!ba;s/\n/%0A/g')}"
            if [ "$digest" != "$RELEASE_CERT_SHA256" ]; then
              release=false
              if [ -n "$SIGNING_PASSWORD" ]; then
                echo "::error::$(basename "$apk") is not signed with the release key."
                exit 1
              fi
            fi
          done
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunnelLock-apks
          path: |
            app/build/outputs/apk/release/*.apk
            probe/build/outputs/apk/release/*.apk

      # Published as the "latest" release with fixed file names, so these links always
      # give the newest build and can be opened straight from the phone's browser:
      #   https://github.com/<owner>/<repo>/releases/latest/download/TunnelLock.apk
      #   https://github.com/<owner>/<repo>/releases/latest/download/TunnelProbe.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signature.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/TunnelLock.apk
          cp probe/build/outputs/apk/release/*.apk dist/TunnelProbe.apk
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/TunnelLock.apk dist/TunnelProbe.apk \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "TunnelLock 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Build from ${GITHUB_SHA::7}. TunnelLock.apk is the app (installs as an update). TunnelProbe.apk is the leak-test tool."
