name: Emulator test

# End-to-end test on an Android emulator: a work profile owned by TunnelLock,
# real Xray and OpenVPN servers on this machine, and TunnelProbe checking for
# leaks while servers and the app are killed (see e2e/run.sh).
# Runs on pushes to the "e2e" branch, or by hand.
on:
  push:
    branches: ["e2e"]
  workflow_dispatch:

permissions:
  contents: read

env:
  XRAY_LIB_VERSION: v26.10.21
  XRAY_LIB_SHA256: e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4
  NDK_VERSION: 27.2.12479018
  # The Xray server: the same core version as the app's library.
  XRAY_SERVER_MODULE: github.com/xtls/xray-core/main@v1.260327.1-0.20261021115930-1b1647cd9ddf

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${XRAY_LIB_VERSION}/libv2ray.aar"
          echo "${XRAY_LIB_SHA256}  app/libs/libv2ray.aar" | sha256sum -c -
          unzip -l app/libs/libv2ray.aar | grep -q 'jni/x86_64/' \
            || { echo "::error::libv2ray.aar has no x86_64 library for the emulator"; exit 1; }

      - name: Restore OpenVPN binaries
        id: openvpn-cache
        uses: actions/cache/restore@v4
        with:
          path: native/out
          key: openvpn-${{ hashFiles('native/build-openvpn.sh') }}-ndk-${{ env.NDK_VERSION }}

      - name: Build OpenVPN
        if: steps.openvpn-cache.outputs.cache-hit != 'true'
        run: |
          { sudo apt-get update -qq && sudo apt-get install -y -qq autoconf automake libtool pkg-config; } >/tmp/apt.log 2>&1 \
            || { echo "::error title=apt-get failed::$(tail -5 /tmp/apt.log | tr '\n' ' ')"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/tmp/sdk.log 2>&1 \
            || { echo "::error title=NDK install failed::$(tail -5 /tmp/sdk.log | tr '\n' ' ')"; exit 1; }
          native/build-openvpn.sh "$ANDROID_HOME/ndk/${NDK_VERSION}" native/out

      # Saved right away, so a later failing step does not throw the build away.
      - name: Save OpenVPN binaries
        if: steps.openvpn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/out
          key: openvpn-${{ hashFiles('native/build-openvpn.sh') }}-ndk-${{ env.NDK_VERSION }}

      # Debug-signed, without the log token: these APKs never leave the test.
      - name: Build test APKs
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r native/out/. app/src/main/jniLibs/
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease :probe:assembleRelease -PextraAbis=x86_64 2>&1 | tee build.log \
            || { echo "::error title=Gradle::$(grep -E '^e: ' build.log | head -10 | tr '\n' ' ')"; exit 1; }

      - name: Start test servers
        run: e2e/servers.sh setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash e2e/run.sh

      - name: Server logs
        if: always()
        run: |
          for f in xray.log openvpn.log; do
            [ -f "e2e/out/$f" ] && echo "::notice title=$f::$(sudo tail -25 "e2e/out/$f" | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          true

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/out/logs
          if-no-files-found: ignore
